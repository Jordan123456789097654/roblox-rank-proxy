<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Proxy Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #232527; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background-color: #393b3d; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2 { color: #fff; margin-top: 0; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #b8b8b8; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #232527; border: 1px solid #555; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #00b06f; color: white; border: none; padding: 10px 15px; margin-top: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: #00905a; }
        .alert { padding: 10px; border-radius: 4px; margin-top: 15px; display: none; }
        .success { background-color: rgba(0, 176, 111, 0.2); color: #00b06f; border: 1px solid #00b06f; }
        .error { background-color: rgba(255, 68, 68, 0.2); color: #ff4444; border: 1px solid #ff4444; }
    </style>
</head>
<body>

    <h1>🛡️ Proxy Admin Dashboard</h1>
    
    <div class="card">
        <h2>Authentication</h2>
        <p style="font-size: 12px; color: #b8b8b8;">Enter your PROXY_API_KEY from Render to authorize actions.</p>
        <input type="password" id="apiKey" placeholder="Enter API Key...">
    </div>

    <div class="card">
        <h2>📈 Rank a User</h2>
        <label>Target Roblox User ID</label>
        <input type="number" id="robloxId" placeholder="e.g. 123456789">
        <label>New Rank Number (1-255)</label>
        <input type="number" id="rankNumber" placeholder="e.g. 10">
        <button onclick="submitAction('/setrank-manual', { robloxId: document.getElementById('robloxId').value, rankNumber: document.getElementById('rankNumber').value })">Set Rank</button>
    </div>

    <div class="card">
        <h2>📢 Post Group Shout</h2>
        <label>Shout Message</label>
        <textarea id="shoutMessage" rows="3" placeholder="Enter shout message here..."></textarea>
        <button onclick="submitAction('/shout', { message: document.getElementById('shoutMessage').value })">Post Shout</button>
    </div>

    <div id="statusAlert" class="alert"></div>

    <script>
        async function submitAction(endpoint, bodyData) {
            const apiKey = document.getElementById('apiKey').value;
            const alertBox = document.getElementById('statusAlert');
            
            if (!apiKey) {
                showAlert('Please enter your API Key first!', 'error');
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Success: ' + data.message, 'success');
                } else {
                    showAlert('Error: ' + (data.error || data.details), 'error');
                }
            } catch (err) {
                showAlert('Network Error: Could not connect to server.', 'error');
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.textContent = message;
            alertBox.className = 'alert ' + type;
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 5000);
        }
    </script>
</body>
</html>
